# 使用方式：--spring.profiles.active=deepseek
# 对话和查询改写走 DeepSeek；向量生成仍走 application.yml 中的本地 Ollama。
# API Key 只从环境变量读取，不要把真实密钥写入此文件。
spring:
  config:
    activate:
      on-profile: deepseek

rag:
  chat-api-base-url: ${RAG_CHAT_API_BASE_URL:https://api.deepseek.com}
  chat-api-key: ${RAG_CHAT_API_KEY:}
  chat-model: ${RAG_CHAT_MODEL:deepseek-v4-flash}

